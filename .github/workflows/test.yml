name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatage
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Fichiers non formates :"
            echo "$unformatted"
            exit 1
          fi

      - name: Analyse statique
        run: go vet ./...

      - name: Tests (pilote cgo)
        run: go test -race ./...

      # Les binaires distribues sont compiles en Go pur : si seule la variante
      # cgo etait testee, une regression du pilote ne se verrait qu'apres la
      # publication.
      - name: Tests (pilote Go pur)
        run: go test -tags purego ./...

      - name: Compilation croisee du binaire distribue
        env:
          CGO_ENABLED: "0"
        run: |
          for cible in linux/arm64 linux/arm linux/amd64; do
            GOOS="${cible%/*}" GOARCH="${cible#*/}" \
              go build -tags purego ./... || exit 1
          done
